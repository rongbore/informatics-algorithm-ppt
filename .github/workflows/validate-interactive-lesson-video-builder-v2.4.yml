name: Validate Interactive Lesson Video Builder V2.4

on:
  push:
    branches:
      - "feature/interactive-lesson-video-builder-v2.4*"
    paths:
      - "skills/interactive-lesson-video-builder-v2.4/**"
      - "skills/interactive-lesson-video-builder/SKILL.md"
      - ".github/workflows/validate-interactive-lesson-video-builder-v2.4.yml"
  pull_request:
    paths:
      - "skills/interactive-lesson-video-builder-v2.4/**"
      - ".github/workflows/validate-interactive-lesson-video-builder-v2.4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg for media smoke tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install V2.4 dependencies
        run: python -m pip install -r skills/interactive-lesson-video-builder-v2.4/requirements-v2.4.txt
      - name: Compile Python modules
        run: python -m compileall -q skills/interactive-lesson-video-builder-v2.4/scripts skills/interactive-lesson-video-builder-v2.4/tests
      - name: Validate V2.4 config JSON
        run: python -c "import json,pathlib; json.loads(pathlib.Path('skills/interactive-lesson-video-builder-v2.4/config/video_ux_v2_4.json').read_text(encoding='utf-8'))"
      - name: Parse PowerShell production runner
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("skills/interactive-lesson-video-builder-v2.4/scripts/run_video_builder_v2_6.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Run unit tests
        working-directory: skills/interactive-lesson-video-builder-v2.4
        run: python -m unittest discover -s tests -v
