name: Validate and package interactive lesson video builder V2.3
on:
  pull_request:
    paths:
      - "skills/interactive-lesson-video-builder/**"
      - ".github/workflows/validate-interactive-lesson-video-builder-v2.3.yml"
  push:
    branches: [main]
    paths:
      - "skills/interactive-lesson-video-builder/**"
jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python -m compileall -q skills/interactive-lesson-video-builder/scripts
      - name: Run unit tests
        run: python -m unittest discover -s skills/interactive-lesson-video-builder/tests -v
      - name: Package reusable Skill
        run: |
          cd skills
          zip -r ../interactive-lesson-video-builder-v2.3.zip interactive-lesson-video-builder
      - name: Upload Skill ZIP
        uses: actions/upload-artifact@v4
        with:
          name: interactive-lesson-video-builder-v2.3
          path: interactive-lesson-video-builder-v2.3.zip
          if-no-files-found: error
