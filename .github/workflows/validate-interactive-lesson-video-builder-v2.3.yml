name: Validate interactive lesson video builder V2.3
on:
  pull_request:
    paths:
      - "skills/interactive-lesson-video-builder/**"
  push:
    branches: [main]
    paths:
      - "skills/interactive-lesson-video-builder/**"
jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python scripts
        run: python -m compileall -q skills/interactive-lesson-video-builder/scripts
      - name: Run unit tests
        run: python -m unittest discover -s skills/interactive-lesson-video-builder/tests -v
